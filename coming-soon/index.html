<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="FABIUS — where time becomes legacy. The new digital house is arriving soon.">
  <meta name="theme-color" content="#07080a">
  <title>FABIUS — Coming Soon</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500&family=Libre+Baskerville:ital,wght@0,400;1,400&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body class="launch-page">
  <div class="ambient" aria-hidden="true"></div>
  <header class="launch-header">
    <a class="launch-wordmark" href="./" aria-label="Fabius coming soon">FABIUS</a>
    <span>Est. India</span>
  </header>

  <main class="launch-main">
    <section class="launch-copy" aria-labelledby="launch-title">
      <span class="eyebrow">The House of FABIUS</span>
      <h1 id="launch-title">Where Time<br><em>Becomes Legacy</em></h1>
      <p>A modern Indian watch house shaped by precision, purpose and enduring elegance. Our new digital experience is
        being carefully composed.</p>
      <div class="launch-status"><i></i><strong>Arriving Soon</strong></div>
    </section>

    <div class="timepiece">
      <div class="timepiece-aura"></div>
      <div class="timepiece-case" role="img" aria-label="Indian Standard Time clock">
        <span class="marker marker-12"></span><span class="marker marker-3"></span><span
          class="marker marker-6"></span><span class="marker marker-9"></span>
        <span class="timepiece-name">FABIUS</span>
        <span class="hand hand-hour"></span><span class="hand hand-minute"></span><span
          class="hand hand-second"></span><i class="pin"></i>
        <small>Automatic</small>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>

</html>
